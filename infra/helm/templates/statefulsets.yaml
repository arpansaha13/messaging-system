apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
  labels:
    app.kubernetes.io/name: auth-db
    {{- include "messaging-system.labels" . | nindent 4 }}
spec:
  serviceName: auth-db-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-db
        {{- include "messaging-system.labels" . | nindent 8 }}
    spec:
      containers:
        - name: auth-db
          image: "{{ .Values.images.authDb.repository }}:{{ .Values.images.authDb.tag }}"
          imagePullPolicy: {{ .Values.images.authDb.pullPolicy }}
          args: ["-c", "max_connections=100"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.secretName }}
                  key: AUTH_DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.secretName }}
                  key: AUTH_DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.env.configMapName }}
                  key: AUTH_DB_NAME
          volumeMounts:
            - name: auth-db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: auth-db-data
          hostPath:
            path: {{ .Values.persistence.authDb.hostPath }}
            type: DirectoryOrCreate
---

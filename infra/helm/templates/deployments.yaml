          envFrom:
            - configMapRef:
                name: {{ .Values.env.configMapName }}
            - secretRef:
                name: {{ .Values.env.secretName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    {{- include "messaging-system.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.frontend }}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        {{- include "messaging-system.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NUXT_ENVIRONMENT
              value: development
            - name: NUXT_PUBLIC_ENVIRONMENT
              value: development
            - name: NUXT_AUTH_COOKIE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.env.configMapName }}
                  key: AUTH_COOKIE_NAME
            - name: NUXT_PUBLIC_AUTH_COOKIE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.env.configMapName }}
                  key: AUTH_COOKIE_NAME
            - name: NUXT_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.env.configMapName }}
                  key: NUXT_API_BASE_URL
            - name: NUXT_HOST
              value: 0.0.0.0
            - name: HOST
              value: 0.0.0.0
          envFrom:
            - configMapRef:
                name: {{ .Values.env.configMapName }}
            - secretRef:
                name: {{ .Values.env.secretName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:

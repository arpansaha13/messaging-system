apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  labels:
    app.kubernetes.io/name: memcached
    {{- include "messaging-system.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.memcached }}
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memcached
        {{- include "messaging-system.labels" . | nindent 8 }}
    spec:
      containers:
        - name: memcached
          image: "{{ .Values.images.memcached.repository }}:{{ .Values.images.memcached.tag }}"
          imagePullPolicy: {{ .Values.images.memcached.pullPolicy }}
          ports:
            - name: memcached
              containerPort: 11211
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-cache
  labels:
    app.kubernetes.io/name: auth-cache
    {{- include "messaging-system.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.authCache }}
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-cache
        {{- include "messaging-system.labels" . | nindent 8 }}
    spec:
      containers:
        - name: auth-cache
          image: "{{ .Values.images.memcached.repository }}:{{ .Values.images.memcached.tag }}"
          imagePullPolicy: {{ .Values.images.memcached.pullPolicy }}
          ports:
            - name: memcached
              containerPort: 11211
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: auth
    {{- include "messaging-system.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.auth }}
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        {{- include "messaging-system.labels" . | nindent 8 }}
    spec:
      containers:
        - name: auth
          image: "{{ .Values.images.auth.repository }}:{{ .Values.images.auth.tag }}"
          imagePullPolicy: {{ .Values.images.auth.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
            - name: grpc
              containerPort: 50051
          env:
            - name: ENVIRONMENT
              value: development
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.secretName }}
                  key: AUTH_DATABASE_URL
            - name: MEMCACHED_HOST
              value: auth-cache
            - name: MEMCACHED_PORT
              value: "11211"
          envFrom:
            - configMapRef:
                name: {{ .Values.env.configMapName }}
            - secretRef:
                name: {{ .Values.env.secretName }}
---

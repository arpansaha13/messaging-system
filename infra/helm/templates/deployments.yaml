---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socket
  labels:
    app.kubernetes.io/name: socket
    {{- include "messaging-system.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.socket }}
  selector:
    matchLabels:
      app.kubernetes.io/name: socket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: socket
        {{- include "messaging-system.labels" . | nindent 8 }}
    spec:
      containers:
        - name: socket
          image: "{{ .Values.images.socket.repository }}:{{ .Values.images.socket.tag }}"
          imagePullPolicy: {{ .Values.images.socket.pullPolicy }}

apiVersion: v1
kind: Service
metadata:
  name: auth-db-headless
  labels:
    app.kubernetes.io/name: auth-db
    {{- include "messaging-system.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: auth-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

services:
  nginx:
    image: nginx:alpine
    container_name: nginx_prod
    ports:
      - "7000:443"
    volumes:
      - ./apps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
      socket:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - messaging-network

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db_prod
    environment:
      POSTGRES_USER: ${AUTH_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "7010:5432"
    volumes:
      - ./data/auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  auth:
    image: europe-north1-docker.pkg.dev/chat-application-13/auth/api:0.1.0
    container_name: auth_system_prod
    expose:
      - "50051"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgres://${AUTH_DB_USERNAME}:${AUTH_DB_PASSWORD}@auth-db:5432/${AUTH_DB_NAME}
      GRPC_HOST: ${GRPC_HOST}
      GRPC_PORT: ${GRPC_PORT}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES}
      SESSION_CLEANUP_INTERVAL_MINUTES: ${SESSION_CLEANUP_INTERVAL_MINUTES}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      LOG_LEVEL: ${LOG_LEVEL}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES}
      OTP_LENGTH: ${OTP_LENGTH}
      EMAIL_WORKER_POOL_SIZE: ${EMAIL_WORKER_POOL_SIZE}
      EMAIL_TASK_QUEUE_SIZE: ${EMAIL_TASK_QUEUE_SIZE}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - messaging-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres_prod
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "7020:5432"
    volumes:
      - ./data/default:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  backend:
    image: europe-north1-docker.pkg.dev/chat-application-13/backend/api:0.1.0
    container_name: backend_prod
    environment:
      ENVIRONMENT: production
      API_PORT: 4000
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_LOGGING: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${SOCKET_RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${SOCKET_RABBITMQ_PASS:-guest}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_TOKEN_VALIDITY_SECONDS: ${JWT_TOKEN_VALIDITY_SECONDS}
      OTP_VALIDATION_SECONDS: ${OTP_VALIDATION_SECONDS}
      AUTH_SYSTEM_HOST: ${AUTH_SYSTEM_HOST:-auth:50051}
    ports:
      - "7030:4000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
    networks:
      - messaging-network

  socket:
    image: europe-north1-docker.pkg.dev/chat-application-13/socket/ws:0.1.0
    container_name: socket_prod
    environment:
      ENVIRONMENT: production
      PORT: 4000
      SERVER_ID: ${SOCKET_SERVER_ID:-server-1}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${SOCKET_RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${SOCKET_RABBITMQ_PASS:-guest}
      CLIENT_DOMAIN: ${CLIENT_DOMAIN}
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    depends_on:
      rabbitmq:
        condition: service_healthy
      memcached:
        condition: service_started
    networks:
      - messaging-network

  frontend:
    image: europe-north1-docker.pkg.dev/chat-application-13/frontend/app:0.1.0
    container_name: frontend_prod
    environment:
      ENVIRONMENT: production
      API_BASE_URL: ${API_BASE_URL}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-}
      NUXT_PUBLIC_API_BASE_URL: ${API_BASE_URL}
      NUXT_PUBLIC_AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      NUXT_PUBLIC_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-}
    depends_on:
      backend:
        condition: service_started
    networks:
      - messaging-network

  memcached:
    image: memcached:1.6.40-alpine
    container_name: memcached
    networks:
      - messaging-network

  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    container_name: rabbitmq_prod
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  chat-worker:
    image: europe-north1-docker.pkg.dev/chat-application-13/chat-worker-go/app:0.1.0
    container_name: chat_worker_go_prod
    environment:
      ENVIRONMENT: production
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_LOGGING: "false"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - messaging-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    # ports:
    #   - "7070:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - messaging-network

  loki:
    image: grafana/loki:3.0.0-alpine
    container_name: loki_prod
    environment:
      LOKI_CONFIG_FILENAME: /etc/loki/loki-config.yml
    volumes:
      - ./apps/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./data/loki:/loki
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3100/loki/api/v1/status || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  alloy:
    image: grafana/alloy:latest
    container_name: alloy_prod
    command:
      - run
      - /etc/alloy/alloy-config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./apps/alloy/alloy-config.alloy:/etc/alloy/alloy-config.alloy:ro
    depends_on:
      kafka:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - messaging-network

  grafana:
    image: grafana/grafana-oss:10.2.0
    container_name: grafana_prod
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_INSTALL_PLUGINS:
      GF_LOG_LEVEL: info
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${NGINX_DOMAIN_NAME}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./apps/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./apps/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

networks:
  messaging-network:
    driver: bridge

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - '3000:443'
    volumes:
      - ./apps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - messaging-network

  postgres:
    image: postgres:15.10-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '7000:5432'
    volumes:
      - ./data/default:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: backend
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DB_HOST: ${DB_HOST} # postgres service name in docker network
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_NAME}
      DB_LOGGING: 'true'
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_TOKEN_VALIDITY_SECONDS: ${JWT_TOKEN_VALIDITY_SECONDS}
      OTP_VALIDATION_SECONDS: ${OTP_VALIDATION_SECONDS}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_root_node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
    networks:
      - messaging-network
    develop:
      watch:
        - action: sync
          path: ./apps/backend/src
          target: /app/apps/backend/src
        - action: rebuild
          path: ./apps/backend/tsconfig.json

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: frontend
    environment:
      NODE_ENV: development
      API_BASE_URL: ${API_BASE_URL}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-}
      NUXT_PUBLIC_API_BASE_URL: ${API_BASE_URL}
      NUXT_PUBLIC_AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      NUXT_PUBLIC_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-}
      SOCKET_IO_BASE_URL: ${SOCKET_IO_BASE_URL}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - frontend_root_node_modules:/app/node_modules
      - frontend_node_modules:/app/apps/frontend/node_modules
    networks:
      - messaging-network
    develop:
      watch:
        - action: sync
          path: ./apps/frontend/src
          target: /app/apps/frontend/src
        - action: sync
          path: ./apps/frontend/public
          target: /app/apps/frontend/public
        - action: sync
          path: ./apps/frontend/nuxt.config.ts
          target: /app/apps/frontend/nuxt.config.ts
        - action: sync
          path: ./apps/frontend/tsconfig.json
          target: /app/apps/frontend/tsconfig.json

volumes:
  backend_root_node_modules:
    driver: local
  backend_node_modules:
    driver: local
  frontend_root_node_modules:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  messaging-network:
    driver: bridge

services:
  nginx:
    build:
      context: .
      dockerfile: apps/nginx/Dockerfile
    container_name: nginx
    environment:
      ENVIRONMENT: development
    ports:
      - "7000:443"
    volumes:
      - ./data/certs-local:/etc/nginx/certs:ro
    depends_on:
      - backend
      - socket
      - frontend
    networks:
      - messaging-network

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: ${AUTH_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "7010:5432"
    volumes:
      - ./data/auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "7020:5432"
    volumes:
      - ./data/default:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: backend
    environment:
      ENVIRONMENT: development
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_LOGGING: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${BACKEND_RABBITMQ_USER}
      RABBITMQ_PASS: ${BACKEND_RABBITMQ_PASS}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_TOKEN_VALIDITY_SECONDS: ${JWT_TOKEN_VALIDITY_SECONDS}
      OTP_VALIDATION_SECONDS: ${OTP_VALIDATION_SECONDS}
      AUTH_SYSTEM_HOST: ${AUTH_SYSTEM_HOST:-auth:50051}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
    ports:
      - "7030:4000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      auth:
        condition: service_started
    networks:
      - messaging-network
    develop:
      watch:
        - action: rebuild
          path: ./apps/backend/cmd
        - action: rebuild
          path: ./apps/backend/internal
        - action: rebuild
          path: ./apps/backend/pb
        - action: rebuild
          path: ./apps/backend/go.mod
        - action: rebuild
          path: ./apps/backend/go.sum

  socket:
    build:
      context: .
      dockerfile: apps/socket/Dockerfile.dev
    container_name: socket
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL}
      PORT: 4000
      SERVER_ID: ${SOCKET_SERVER_ID:-server-1}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${SOCKET_RABBITMQ_USER}
      RABBITMQ_PASS: ${SOCKET_RABBITMQ_PASS}
      CLIENT_DOMAIN: ${CLIENT_DOMAIN}
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    depends_on:
      rabbitmq:
        condition: service_healthy
      memcached:
        condition: service_started
    networks:
      - messaging-network
    develop:
      watch:
        - action: sync
          path: ./apps/socket/src
          target: /app/apps/socket/src
        - action: rebuild
          path: ./apps/socket/tsconfig.json

  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    container_name: rabbitmq
    ports:
      - "7050:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    container_name: auth
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgres://${AUTH_DB_USERNAME}:${AUTH_DB_PASSWORD}@auth-db:5432/${AUTH_DB_NAME}
      GRPC_HOST: ${GRPC_HOST}
      GRPC_PORT: ${GRPC_PORT}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES}
      SESSION_CLEANUP_INTERVAL_MINUTES: ${SESSION_CLEANUP_INTERVAL_MINUTES}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      LOG_LEVEL: ${LOG_LEVEL}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES}
      OTP_LENGTH: ${OTP_LENGTH}
      EMAIL_WORKER_POOL_SIZE: ${EMAIL_WORKER_POOL_SIZE}
      EMAIL_TASK_QUEUE_SIZE: ${EMAIL_TASK_QUEUE_SIZE}
    # ports:
    #   - '7060:${GRPC_PORT:-50051}'
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - messaging-network
    expose:
      - "50051"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: frontend
    environment:
      ENVIRONMENT: development
      API_BASE_URL: ${API_BASE_URL}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-}
      NUXT_PUBLIC_API_BASE_URL: ${API_BASE_URL}
      NUXT_PUBLIC_AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      NUXT_PUBLIC_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-}
    depends_on:
      backend:
        condition: service_started
    networks:
      - messaging-network
    develop:
      watch:
        - action: sync
          path: ./apps/frontend/src
          target: /app/apps/frontend/src
        - action: sync
          path: ./apps/frontend/public
          target: /app/apps/frontend/public
        - action: sync
          path: ./apps/frontend/nuxt.config.ts
          target: /app/apps/frontend/nuxt.config.ts
        - action: sync
          path: ./apps/frontend/tsconfig.json
          target: /app/apps/frontend/tsconfig.json

  memcached:
    image: memcached:1.6.40-alpine
    container_name: memcached
    networks:
      - messaging-network

  chat-worker:
    build:
      context: .
      dockerfile: apps/chat-worker/Dockerfile
    container_name: chat-worker
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${CHAT_WORKER_RABBITMQ_USER}
      RABBITMQ_PASS: ${CHAT_WORKER_RABBITMQ_PASS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_LOGGING: "true"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - messaging-network
    develop:
      watch:
        - action: rebuild
          path: ./apps/chat-worker/cmd
        - action: rebuild
          path: ./apps/chat-worker/internal
        - action: rebuild
          path: ./apps/chat-worker/go.mod

  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    # ports:
    #   - "7070:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - messaging-network

  init-kafka:
    image: apache/kafka:3.9.2
    container_name: init-kafka
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      # Block until Kafka is reachable
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

      echo 'Creating topics...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic application-logs --replication-factor 1 --partitions 3
      "
    networks:
      - messaging-network

  loki:
    build:
      context: .
      dockerfile: apps/loki/Dockerfile
    container_name: loki
    environment:
      LOKI_CONFIG_FILENAME: /etc/loki/loki-config.yml
    volumes:
      - ./data/loki:/tmp/loki
    # ports:
    #   - "7080:3100"
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network
    develop:
      watch:
        - action: rebuild
          path: ./apps/loki/loki-config.yml

  alloy:
    build:
      context: .
      dockerfile: apps/alloy/Dockerfile
    container_name: alloy
    depends_on:
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    # ports:
    #   - "7085:12345"
    networks:
      - messaging-network
    develop:
      watch:
        - action: rebuild
          path: ./apps/alloy/alloy-config.alloy

  grafana:
    build:
      context: .
      dockerfile: apps/grafana/Dockerfile
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS:
      GF_LOG_LEVEL: info
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./data/grafana:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "7090:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network
    develop:
      watch:
        - action: rebuild
          path: ./apps/grafana/provisioning/datasources
        - action: rebuild
          path: ./apps/grafana/provisioning/dashboards

networks:
  messaging-network:
    driver: bridge

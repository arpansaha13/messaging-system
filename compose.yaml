services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - '3000:443'
    volumes:
      - ./apps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - socket
      - frontend
    networks:
      - messaging-network

  postgres:
    image: postgres:15.10-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '7000:5432'
    volumes:
      - ./data/default:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: backend
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DB_HOST: ${DB_HOST} # postgres service name in docker network
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_NAME}
      DB_LOGGING: 'true'
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_TOKEN_VALIDITY_SECONDS: ${JWT_TOKEN_VALIDITY_SECONDS}
      OTP_VALIDATION_SECONDS: ${OTP_VALIDATION_SECONDS}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - messaging-network
    develop:
      watch:
        - action: sync
          path: ./apps/backend/src
          target: /app/apps/backend/src
        - action: rebuild
          path: ./apps/backend/tsconfig.json

  socket:
    build:
      context: .
      dockerfile: apps/socket/Dockerfile.dev
    container_name: socket
    environment:
      NODE_ENV: development
      PORT: 4000
      SERVER_ID: ${SOCKET_SERVER_ID:-server-1}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      CLIENT_DOMAIN: ${CLIENT_DOMAIN}
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - messaging-network
    develop:
      watch:
        - action: sync
          path: ./apps/socket/src
          target: /app/apps/socket/src
        - action: rebuild
          path: ./apps/socket/tsconfig.json

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: frontend
    environment:
      NODE_ENV: development
      API_BASE_URL: ${API_BASE_URL}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-}
      NUXT_PUBLIC_API_BASE_URL: ${API_BASE_URL}
      NUXT_PUBLIC_AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      NUXT_PUBLIC_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-}
      SOCKET_IO_BASE_URL: ${SOCKET_IO_BASE_URL:-}
    depends_on:
      backend:
        condition: service_started
    networks:
      - messaging-network
    develop:
      watch:
        - action: sync
          path: ./apps/frontend/src
          target: /app/apps/frontend/src
        - action: sync
          path: ./apps/frontend/public
          target: /app/apps/frontend/public
        - action: sync
          path: ./apps/frontend/nuxt.config.ts
          target: /app/apps/frontend/nuxt.config.ts
        - action: sync
          path: ./apps/frontend/tsconfig.json
          target: /app/apps/frontend/tsconfig.json

  memcached:
    image: memcached:1.6.40-alpine
    container_name: memcached
    networks:
      - messaging-network

  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    container_name: rabbitmq
    ports:
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  chat-worker:
    build:
      context: .
      dockerfile: apps/chat-worker/Dockerfile.dev
    container_name: chat-worker
    environment:
      NODE_ENV: development
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_LOGGING: 'true'
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - messaging-network
    develop:
      watch:
        - action: sync
          path: ./apps/chat-worker/src
          target: /app/apps/chat-worker/src
        - action: rebuild
          path: ./apps/chat-worker/tsconfig.json

networks:
  messaging-network:
    driver: bridge

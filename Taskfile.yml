version: '3'

# Taskfile for managing messaging-system microservices.
# Uses golang-migrate (https://github.com/golang-migrate/migrate)

vars:
  SERVICES: auth backend user

tasks:
  default:
    cmds:
      - task --list
    silent: true

  headlamp:
    desc: Generate authentication token and start Headlamp dashboard UI
    cmds:
      - ./tools/scripts/start-headlamp.sh

  test:integration:
    desc: Run all Go service integration tests (default container mode)
    cmds:
      - TEST_DEPS_MODE=container sh -c 'cd apps/auth/server && go test ./tests/... -timeout 300s'
      - TEST_DEPS_MODE=container sh -c 'cd apps/backend/server && go test ./tests/... -timeout 300s'
      - TEST_DEPS_MODE=container sh -c 'cd apps/user && go test ./tests/... -timeout 300s'
      - TEST_DEPS_MODE=container sh -c 'cd apps/chat-worker && go test ./tests/... -timeout 300s'

  test:integration:external:
    desc: Run all Go service integration tests against externally running dependencies
    dotenv: ['.env.test']
    summary: |
      Uses TEST_DEPS_MODE=external and service-specific Postgres DSNs:
      - TEST_POSTGRES_DSN_AUTH
      - TEST_POSTGRES_DSN_BACKEND
      - TEST_POSTGRES_DSN_USER
      - TEST_POSTGRES_DSN_CHAT_WORKER
    cmds:
      - TEST_DEPS_MODE=external sh -c 'cd apps/auth/server && go test ./tests/... -timeout 300s'
      - TEST_DEPS_MODE=external sh -c 'cd apps/backend/server && go test ./tests/... -timeout 300s'
      - TEST_DEPS_MODE=external sh -c 'cd apps/user && go test ./tests/... -timeout 300s'
      - TEST_DEPS_MODE=external sh -c 'cd apps/chat-worker && go test ./tests/... -timeout 300s'

  migrate:up:
    desc: Run all pending migrations for a service or all services
    summary: |
      Apply all pending migrations.
      Usage:
        task migrate:up SERVICE=<service_name>
        task migrate:up (runs for all services: {{.SERVICES}})
    vars:
      TARGET_SERVICES: '{{.SERVICE | default .SERVICES}}'
    cmds:
      - for: { var: TARGET_SERVICES, split: " " }
        task: migrate:service:up
        vars: { SERVICE: '{{.ITEM}}' }
    silent: true

  migrate:down:
    desc: Rollback the last migration for a service or all services
    summary: |
      Rollback the last migration (count=1).
      Usage:
        task migrate:down SERVICE=<service_name>
        task migrate:down (runs for all services: {{.SERVICES}})
    vars:
      TARGET_SERVICES: '{{.SERVICE | default .SERVICES}}'
    cmds:
      - for: { var: TARGET_SERVICES, split: " " }
        task: migrate:service:down
        vars: { SERVICE: '{{.ITEM}}' }
    silent: true

  migrate:status:
    desc: Show current migration version for a service or all services
    summary: |
      Show current migration version.
      Usage:
        task migrate:status SERVICE=<service_name>
        task migrate:status (runs for all services: {{.SERVICES}})
    vars:
      TARGET_SERVICES: '{{.SERVICE | default .SERVICES}}'
    cmds:
      - for: { var: TARGET_SERVICES, split: " " }
        task: migrate:service:status
        vars: { SERVICE: '{{.ITEM}}' }
    silent: true

  migrate:create:
    desc: Create a new SQL migration file for a specific service
    summary: |
      Create a new SQL migration file.
      Usage:
        task migrate:create SERVICE=<service_name> NAME=<migration_name>
    preconditions:
      - sh: '[ "{{.SERVICE}}" != "" ]'
        msg: "SERVICE is required (e.g., SERVICE=backend)"
      - sh: '[ "{{.NAME}}" != "" ]'
        msg: "NAME is required (e.g., NAME=add_fields)"
    cmds:
      - task: migrate:service:create
        vars: { SERVICE: "{{.SERVICE}}", NAME: "{{.NAME}}" }
  dev:local:
    desc: Start the entire local development server stack (non-containerized, Linux)
    cmds:
      - ./tools/scripts/start-local-dev.sh

  dev:local:stop:
    desc: Stop the local development server stack
    cmds:
      - ./tools/scripts/start-local-dev.sh stop

  dev:local:status:
    desc: Check status of all local dev services and their ports
    cmds:
      - ./tools/scripts/status-local-dev.sh

  dev:local:seed:
    desc: Seed the local dev databases using .env.local variables
    cmds:
      - |
        set -a
        source .env.local
        set +a
        pnpm --filter seed db:seed

  # ---------------------------------------------------------------------------
  # Internal service-specific tasks
  # ---------------------------------------------------------------------------

  migrate:service:up:
    internal: true
    cmds:
      - DB_URL="{{.DB_URL}}" ./tools/scripts/migrate.sh up {{.SERVICE}}

  migrate:service:down:
    internal: true
    cmds:
      - DB_URL="{{.DB_URL}}" ./tools/scripts/migrate.sh down {{.SERVICE}}

  migrate:service:status:
    internal: true
    cmds:
      - DB_URL="{{.DB_URL}}" ./tools/scripts/migrate.sh status {{.SERVICE}}

  migrate:service:create:
    internal: true
    cmds:
      - ./tools/scripts/migrate.sh create {{.SERVICE}} {{.NAME}}

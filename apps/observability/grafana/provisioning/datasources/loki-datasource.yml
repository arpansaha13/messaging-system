apiVersion: 1

datasources:
  - name: Loki
    type: loki
    url: http://loki:3100
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Link traces from the parsed trace_id label.
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: View Trace
        - name: UserID
          matcherRegex: '"user_id"\s*:\s*"(.+?)"'
          url: /explore

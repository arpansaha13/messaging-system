auth_enabled: false

server:
  http_listen_port: 3100
  # grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true         # Enables the new Loki 3.0 volume indexing features
  retention_period: 720h       # 30 days retention
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /tmp/loki/compactor
  compaction_interval: 10m
  # retention_enabled: true      # This replaces the old table_manager
  delete_request_cancel_period: 24h

# Bloom filters are a major feature of 3.x for faster searching
# bloom_build:
#   enabled: true
# bloom_gateway:
#   enabled: true
worker_processes  auto;
pid        /tmp/nginx_dev.pid;

events {
  worker_connections 1024;
}

http {
	access_log  /tmp/nginx_dev_access.log;
	error_log   /tmp/nginx_dev_error.log warn;

	client_body_temp_path /tmp/nginx_dev_client_body;
	proxy_temp_path /tmp/nginx_dev_proxy;
	fastcgi_temp_path /tmp/nginx_dev_fastcgi;
	uwsgi_temp_path /tmp/nginx_dev_uwsgi;
	scgi_temp_path /tmp/nginx_dev_scgi;

	sendfile        on;
	keepalive_timeout  65;

	server {
		listen 7000;
		server_name localhost;

		proxy_buffering off;

		# https://github.com/nuxt/icon?tab=readme-ov-file#icon-customization
		location /api/_nuxt_icon/ {
			proxy_pass http://127.0.0.1:3000;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/auth/ {
			proxy_pass http://127.0.0.1:4001;
			proxy_redirect off;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
		}

		location /api/users/ {
			proxy_pass http://127.0.0.1:4002;
			proxy_redirect off;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
		}

		location /api/contacts/ {
			proxy_pass http://127.0.0.1:4002;
			proxy_redirect off;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
		}

		location /api/ {
			proxy_pass http://127.0.0.1:4003;
			proxy_redirect off;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
		}

		location /ws/ {
			proxy_pass http://127.0.0.1:4004;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# https://github.com/nuxt/nuxt/issues/12003#issuecomment-1397230032
		location /_nuxt/ {
			proxy_pass http://127.0.0.1:3000;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_cache_bypass $http_upgrade;
		}

		location / {
			proxy_pass http://127.0.0.1:3000;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}

version: "3.8"

services:
  nginx:
    build:
      context: .
      dockerfile: apps/nginx/Dockerfile
    container_name: nginx_prod
    environment:
      ENVIRONMENT: production
      NGINX_DOMAIN_NAME: ${NGINX_DOMAIN_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/certs/certbot-etc:/etc/letsencrypt:ro
      - ./data/certs/certbot-var:/var/lib/letsencrypt:ro
    depends_on:
      - backend
      - socket
      - frontend
    networks:
      - messaging-network

  certbot:
    image: certbot/certbot
    container_name: certbot_prod
    volumes:
      - ./data/certs/certbot-etc:/etc/letsencrypt
      - ./data/certs/certbot-var:/var/lib/letsencrypt
    command: >
      certonly --standalone
      --preferred-challenges http
      --http-01-port 8080
      -d ${CERTBOT_DOMAIN}
      --email ${CERTBOT_EMAIL}
      --agree-tos
      --no-eff-email
      --non-interactive
    depends_on:
      - nginx
    networks:
      - messaging-network

  auth:
    image: europe-north1-docker.pkg.dev/chat-application-13/auth/api:0.1.0
    container_name: auth_prod
    labels:
      service_name: "auth"
    logging:
      driver: json-file
      options:
        labels: "service_name"
    expose:
      - "50051"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://${AUTH_DB_USERNAME}:${AUTH_DB_PASSWORD}@${AUTH_DB_HOST}:5432/${AUTH_DB_NAME}
      GRPC_HOST: ${GRPC_HOST}
      GRPC_PORT: ${GRPC_PORT}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES}
      SESSION_CLEANUP_INTERVAL_MINUTES: ${SESSION_CLEANUP_INTERVAL_MINUTES}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES}
      OTP_LENGTH: ${OTP_LENGTH}
      EMAIL_WORKER_POOL_SIZE: ${EMAIL_WORKER_POOL_SIZE}
      EMAIL_TASK_QUEUE_SIZE: ${EMAIL_TASK_QUEUE_SIZE}
    networks:
      - messaging-network

  backend:
    image: europe-north1-docker.pkg.dev/chat-application-13/backend/api:0.1.0
    container_name: backend_prod
    labels:
      service_name: "backend"
    logging:
      driver: json-file
      options:
        labels: "service_name"
    environment:
      ENVIRONMENT: production
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_LOGGING: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${BACKEND_RABBITMQ_USER}
      RABBITMQ_PASS: ${BACKEND_RABBITMQ_PASS}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_TOKEN_VALIDITY_SECONDS: ${JWT_TOKEN_VALIDITY_SECONDS}
      OTP_VALIDATION_SECONDS: ${OTP_VALIDATION_SECONDS}
      AUTH_SYSTEM_HOST: ${AUTH_SYSTEM_HOST}
    ports:
      - "7030:4000"
    depends_on:
      - rabbitmq
      - auth
    networks:
      - messaging-network

  socket:
    image: europe-north1-docker.pkg.dev/chat-application-13/socket-go/ws:0.1.0
    container_name: socket_prod
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL}
      PORT: 4000
      SERVER_ID: ${SOCKET_SERVER_ID}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${SOCKET_RABBITMQ_USER}
      RABBITMQ_PASS: ${SOCKET_RABBITMQ_PASS}
      CLIENT_DOMAIN: ${CLIENT_DOMAIN}
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    depends_on:
      - rabbitmq
      - memcached
    networks:
      - messaging-network

  frontend:
    image: europe-north1-docker.pkg.dev/chat-application-13/frontend/app:0.1.0
    container_name: frontend_prod
    environment:
      ENVIRONMENT: production
      NUXT_AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      NUXT_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME}
      NUXT_API_BASE_URL: ${NUXT_API_BASE_URL}
      NUXT_PUBLIC_AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      NUXT_PUBLIC_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME}
    depends_on:
      - backend
    networks:
      - messaging-network

  memcached:
    image: memcached:1.6.40-alpine
    container_name: memcached_prod
    networks:
      - messaging-network

  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    container_name: rabbitmq_prod
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - messaging-network

  chat-worker:
    image: europe-north1-docker.pkg.dev/chat-application-13/chat-worker/app:0.1.0
    container_name: chat_worker_go_prod
    labels:
      service_name: "chat-worker"
    logging:
      driver: json-file
      options:
        labels: "service_name"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${CHAT_WORKER_RABBITMQ_USER}
      RABBITMQ_PASS: ${CHAT_WORKER_RABBITMQ_PASS}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_LOGGING: "false"
    depends_on:
      - rabbitmq
    networks:
      - messaging-network

  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka_prod
    # ports:
    #   - "7070:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - messaging-network

  init-kafka:
    image: apache/kafka:3.9.2
    container_name: init-kafka_prod
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      echo 'Creating topics...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic application-logs --replication-factor 1 --partitions 3
      "
    networks:
      - messaging-network

  loki:
    build:
      context: .
      dockerfile: apps/loki/Dockerfile
    container_name: loki_prod
    environment:
      LOKI_CONFIG_FILENAME: /etc/loki/loki-config.yml
    volumes:
      - ./data/loki:/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  alloy:
    build:
      context: .
      dockerfile: apps/alloy/Dockerfile
    container_name: alloy_prod
    depends_on:
      - kafka
    networks:
      - messaging-network

  grafana:
    build:
      context: .
      dockerfile: apps/grafana/Dockerfile
    container_name: grafana_prod
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_INSTALL_PLUGINS: ""
      GF_LOG_LEVEL: info
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${NGINX_DOMAIN_NAME}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - loki
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  fluent-bit:
    image: europe-north1-docker.pkg.dev/chat-application-13/fluent-bit/server:0.1.0
    container_name: fluent-bit_prod
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - kafka
    networks:
      - messaging-network

networks:
  messaging-network:
    driver: bridge
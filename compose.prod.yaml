services:
  nginx:
    image: nginx:alpine
    container_name: nginx_prod
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./apps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
      socket:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - messaging-network

  # Auth System - Located outside this repository
  auth:
    build:
      context: ../auth-system
      dockerfile: Dockerfile
    image: auth_system_prod
    container_name: auth_system_prod
    environment:
      DATABASE_URL: postgresql://${AUTH_DB_USERNAME}:${AUTH_DB_PASSWORD}@postgres:5432/${AUTH_DB_NAME}
      GRPC_HOST: ${GRPC_HOST}
      GRPC_PORT: ${GRPC_PORT}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES}
      SESSION_CLEANUP_INTERVAL_MINUTES: ${SESSION_CLEANUP_INTERVAL_MINUTES}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES}
      OTP_LENGTH: ${OTP_LENGTH}
      EMAIL_WORKER_POOL_SIZE: ${EMAIL_WORKER_POOL_SIZE}
      EMAIL_TASK_QUEUE_SIZE: ${EMAIL_TASK_QUEUE_SIZE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - messaging-network
    expose:
      - "50051"

  postgres:
    image: postgres:15.10-alpine
    container_name: postgres_prod
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pgcrypto"
    ports:
      - '7001:5432'
    volumes:
      - ./data/default:/var/lib/postgresql/data
      - ./data/auth:/var/lib/postgresql/data_auth
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.prod
    image: messaging_system_backend_prod
    container_name: backend_prod
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_NAME}
      DB_LOGGING: 'false'
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_TOKEN_VALIDITY_SECONDS: ${JWT_TOKEN_VALIDITY_SECONDS}
      OTP_VALIDATION_SECONDS: ${OTP_VALIDATION_SECONDS}
      AUTH_SYSTEM_HOST: ${AUTH_SYSTEM_HOST}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    networks:
      - messaging-network

  socket:
    build:
      context: .
      dockerfile: apps/socket/Dockerfile.prod
    image: messaging_system_socket_prod
    container_name: socket_prod
    environment:
      NODE_ENV: production
      PORT: 4000
      SERVER_ID: ${SOCKET_SERVER_ID:-server-1}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      CLIENT_DOMAIN: ${CLIENT_DOMAIN}
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - messaging-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.prod
      args:
        AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
    image: messaging_system_frontend_prod
    container_name: frontend_prod
    environment:
      NODE_ENV: production
      API_BASE_URL: ${API_BASE_URL}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-}
      NUXT_PUBLIC_API_BASE_URL: ${API_BASE_URL}
      NUXT_PUBLIC_AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      NUXT_PUBLIC_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-}
    depends_on:
      backend:
        condition: service_started
    networks:
      - messaging-network

  memcached:
    image: memcached:1.6.40-alpine
    container_name: memcached_prod
    networks:
      - messaging-network

  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    container_name: rabbitmq_prod
    ports:
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  chat-worker:
    build:
      context: .
      dockerfile: apps/chat-worker/Dockerfile.prod
    image: messaging_system_chat_worker_prod
    container_name: chat_worker_prod
    environment:
      NODE_ENV: production
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_LOGGING: 'false'
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - messaging-network

networks:
  messaging-network:
    driver: bridge

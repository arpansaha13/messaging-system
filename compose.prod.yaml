services:
  nginx:
    image: nginx:alpine
    container_name: nginx_prod
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./apps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
      socket:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - messaging-network

  postgres:
    image: postgres:15.10-alpine
    container_name: postgres_prod
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '7001:5432'
    volumes:
      - ./data/default:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.prod
    image: messaging_system_backend_prod
    container_name: backend_prod
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_NAME}
      DB_LOGGING: 'false'
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_TOKEN_VALIDITY_SECONDS: ${JWT_TOKEN_VALIDITY_SECONDS}
      OTP_VALIDATION_SECONDS: ${OTP_VALIDATION_SECONDS}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - messaging-network

  socket:
    build:
      context: .
      dockerfile: apps/socket/Dockerfile.prod
    image: messaging_system_socket_prod
    container_name: socket_prod
    environment:
      NODE_ENV: production
      PORT: 4000
      SERVER_ID: ${SOCKET_SERVER_ID:-server-1}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      CLIENT_DOMAIN: ${CLIENT_DOMAIN}
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - messaging-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.prod
      args:
        AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
    image: messaging_system_frontend_prod
    container_name: frontend_prod
    environment:
      NODE_ENV: production
      API_BASE_URL: ${API_BASE_URL}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-}
      NUXT_PUBLIC_API_BASE_URL: ${API_BASE_URL}
      NUXT_PUBLIC_AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      NUXT_PUBLIC_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-}
      SOCKET_IO_BASE_URL: ${SOCKET_IO_BASE_URL}
    depends_on:
      backend:
        condition: service_started
    networks:
      - messaging-network

  memcached:
    image: memcached:1.6.40-alpine
    container_name: memcached_prod
    networks:
      - messaging-network

  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    container_name: rabbitmq_prod
    ports:
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-network

  chat-worker:
    build:
      context: .
      dockerfile: apps/chat-worker/Dockerfile.prod
    image: messaging_system_chat_worker_prod
    container_name: chat_worker_prod
    environment:
      NODE_ENV: production
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_LOGGING: 'false'
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - messaging-network

networks:
  messaging-network:
    driver: bridge
